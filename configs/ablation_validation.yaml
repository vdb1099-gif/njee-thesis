policies:
  sharing: fixed physical slots + term one-hot; shared trunk / distinct heads; joint
    mean CE checkpoint
  sharing_control: same representation/pooled objective/checkpoint; separate trunks
    and heads
  early_stopping_off: 20 epochs; last checkpoint; validation diagnostic only
  subsets: nested prefixes of one TRAIN-only permutation; floor sizes; unchanged val/test
  discretization: same independent Uniform[0,1) matrix; analytic equal-width bins;
    H=d ln K
  inference: exploratory pointwise replica bootstrap; no confirmatory significance
    claims
  failure: no retry/replacement; incomplete pairs excluded with counts
  reference: finite-history stationary TE; truncation bound excludes roundoff
