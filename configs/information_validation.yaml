  frequency_interval: 95-Clopper-Pearson
  secondary_clipping: true
  null_test: frozen-model-heldout-exact-strata-permutation-v1
  p_value: (1+count(T_surrogate>=T_observed))/(B+1)
  classical_significance_tests: false
neural:
  split_seed: 0
  split_fractions:
  - 0.6
  - 0.2
  - 0.2
  training_seed: 0
  component_order:
  - X
  alphabet_policy: declared
  marginal_method: train_plugin
  hidden_sizes:
  - 16
  activation: relu
  optimizer: adam
  learning_rate: 0.01
  batch_size: 64
  max_epochs: 20
  patience: 5
  min_delta: 0.0001
  device: cpu
  reproducibility_mode: strict
  num_workers: 0
